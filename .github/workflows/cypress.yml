name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 1'   # Every Monday 18:00 UTC (11:30 PM IST)
  workflow_dispatch:
    inputs:
      grepTags:
        description: "Tag to filter tests (e.g. @NonFleet). Leave blank to run all."
        required: false
        default: ""

permissions:
  contents: write   # needed to push the report to gh-pages

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/UnderwriterApp/Fleet/underwriterFleet.cy.js
        env:
          CYPRESS_agentEmail: ${{ secrets.AGENT_EMAIL }}
          CYPRESS_agentPassword: ${{ secrets.AGENT_PASSWORD }}
          CYPRESS_agentName: ${{ secrets.AGENT_NAME }}
          CYPRESS_grepTags: ${{ github.event.inputs.grepTags }}
          CYPRESS_grepOmitFiltered: "true"

      # Keep raw results as a downloadable artifact (optional)
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: cypress/report/allure-results
          retention-days: 14

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/images-videos/videos
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/images-videos/screenshots
          retention-days: 7

      # --- Publish Allure report to GitHub Pages ---
      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build report with history
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: cypress/report/allure-results
          allure_history: allure-history
          keep_reports: 20
          gh_pages: gh-pages

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: cypress/report/allure-report
          force_orphan: true

      - name: Verify report exists
        if: always()
        run: ls -la cypress/report/allure-report || echo "Report folder missing!"

      - name: Add report link to run summary
        if: always()
        run: |
          echo "### 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "[Open report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY

      # --- Read pass/fail counts from the Allure summary ---
      - name: Read Allure summary
        if: always()
        id: summary
        run: |
          FILE=$(find . -path "*widgets/summary.json" -not -path "./node_modules/*" | head -1)
          if [ -n "$FILE" ]; then
            echo "total=$(jq '.statistic.total' $FILE)"   >> $GITHUB_OUTPUT
            echo "passed=$(jq '.statistic.passed' $FILE)" >> $GITHUB_OUTPUT
            echo "failed=$(jq '.statistic.failed' $FILE)" >> $GITHUB_OUTPUT
            echo "broken=$(jq '.statistic.broken' $FILE)" >> $GITHUB_OUTPUT
            echo "skipped=$(jq '.statistic.skipped' $FILE)" >> $GITHUB_OUTPUT
          else
            echo "total=N/A"   >> $GITHUB_OUTPUT
            echo "passed=N/A"  >> $GITHUB_OUTPUT
            echo "failed=N/A"  >> $GITHUB_OUTPUT
            echo "broken=N/A"  >> $GITHUB_OUTPUT
            echo "skipped=N/A" >> $GITHUB_OUTPUT
          fi

      # --- Send report by email (runs on push, PR, schedule and manual) ---
      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "QA Automation <${{ secrets.MAIL_USERNAME }}>"
          subject: "Cypress Report (Underwriter Fleet) - ${{ job.status }} - ${{ github.event_name }} - Run #${{ github.run_number }}"
          html_body: |
            <h2>Cypress Test Report - Underwriter Fleet</h2>
            <table cellpadding="6" style="border-collapse:collapse;">
              <tr><td><b>Status</b></td><td>${{ job.status }}</td></tr>
              <tr><td><b>Triggered by</b></td><td>${{ github.event_name }}</td></tr>
              <tr><td><b>Spec</b></td><td>underwriterFleet.cy.js</td></tr>
              <tr><td><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
              <tr><td><b>Tag filter</b></td><td>${{ github.event.inputs.grepTags || 'All tests' }}</td></tr>
              <tr><td><b>Run</b></td><td>#${{ github.run_number }}</td></tr>
            </table>
            <p>
              <b>Total:</b> ${{ steps.summary.outputs.total }} &nbsp;
              <b>Passed:</b> ${{ steps.summary.outputs.passed }} &nbsp;
              <b>Failed:</b> ${{ steps.summary.outputs.failed }} &nbsp;
              <b>Broken:</b> ${{ steps.summary.outputs.broken }} &nbsp;
              <b>Skipped:</b> ${{ steps.summary.outputs.skipped }}
            </p>
            <p>
              <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/">📊 Open Allure Report</a><br>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔗 View GitHub Run</a>
            </p>