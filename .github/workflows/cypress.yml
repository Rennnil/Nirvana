name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grepTags:
        description: "Tag to filter tests (e.g. @NonFleet). Leave blank to run all."
        required: false
        default: ""

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=https://agents.nirvanatech.com/
        env:
          CYPRESS_agentEmail: ${{ secrets.AGENT_EMAIL }}
          CYPRESS_agentPassword: ${{ secrets.AGENT_PASSWORD }}
          CYPRESS_agentName: ${{ secrets.AGENT_NAME }}
          CYPRESS_grepTags: ${{ github.event.inputs.grepTags }}
          CYPRESS_grepOmitFiltered: "true"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: cypress/report/allure-results
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: cypress/report/allure-report
          retention-days: 14

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/images-videos/videos
          retention-days: 7