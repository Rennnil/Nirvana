name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 1'   # Every Monday 18:00 UTC (11:30 PM IST)
  workflow_dispatch:
    inputs:
      grepTags:
        description: "Tag to filter tests (e.g. @NonFleet). Leave blank to run all."
        required: false
        default: ""

permissions:
  contents: write   # needed to push the report to gh-pages

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/**/*.cy.js
        env:
          CYPRESS_agentEmail: ${{ secrets.AGENT_EMAIL }}
          CYPRESS_agentPassword: ${{ secrets.AGENT_PASSWORD }}
          CYPRESS_agentName: ${{ secrets.AGENT_NAME }}
          CYPRESS_grepTags: ${{ github.event.inputs.grepTags }}
          CYPRESS_grepOmitFiltered: "true"

      # Keep raw results as a downloadable artifact (optional)
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: cypress/report/allure-results
          retention-days: 14

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/images-videos/videos
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/images-videos/screenshots
          retention-days: 7

      # --- Publish Allure report to GitHub Pages ---
      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build report with history
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: cypress/report/allure-results
          allure_history: allure-history
          keep_reports: 20
          gh_pages: gh-pages

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: cypress/report/allure-report
          force_orphan: true

      - name: Verify report exists
        if: always()
        run: ls -la cypress/report/allure-report || echo "Report folder missing!"

      - name: Add report link to run summary
        if: always()
        run: |
          echo "### 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "[Open report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY

      # --- Read pass/fail counts from the Allure summary ---
      - name: Read Allure summary
        if: always()
        id: summary
        run: |
          FILE=$(find . -path "*widgets/summary.json" -not -path "./node_modules/*" | head -1)
          if [ -n "$FILE" ]; then
            echo "total=$(jq '.statistic.total' $FILE)"   >> $GITHUB_OUTPUT
            echo "passed=$(jq '.statistic.passed' $FILE)" >> $GITHUB_OUTPUT
            echo "failed=$(jq '.statistic.failed' $FILE)" >> $GITHUB_OUTPUT
            echo "broken=$(jq '.statistic.broken' $FILE)" >> $GITHUB_OUTPUT
            echo "skipped=$(jq '.statistic.skipped' $FILE)" >> $GITHUB_OUTPUT
          else
            echo "total=N/A"   >> $GITHUB_OUTPUT
            echo "passed=N/A"  >> $GITHUB_OUTPUT
            echo "failed=N/A"  >> $GITHUB_OUTPUT
            echo "broken=N/A"  >> $GITHUB_OUTPUT
            echo "skipped=N/A" >> $GITHUB_OUTPUT
          fi

      # --- Send report by email (runs on push, PR, schedule and manual) ---
            # --- Send styled Cypress report by email ---
      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "Nirvana QA Automation <${{ secrets.MAIL_USERNAME }}>"
          subject: "🚀 Nirvana QA | Underwriter Fleet | ${{ job.status }} | Run #${{ github.run_number }}"
          html_body: |
            <!DOCTYPE html>
            <html>
            <body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f1f5f9;padding:24px 8px;">
                <tr>
                  <td align="center">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:680px;background:#ffffff;border-radius:14px;overflow:hidden;">

                      <!-- Header -->
                      <tr>
                        <td style="background:#14213d;padding:28px 30px;color:#ffffff;">
                          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                              <td>
                                <div style="font-size:12px;letter-spacing:2px;color:#c4b5fd;font-weight:bold;">
                                  NIRVANA QA
                                </div>
                                <div style="font-size:25px;font-weight:bold;margin-top:12px;">
                                  Automation Report
                                </div>
                                <div style="font-size:13px;color:#cbd5e1;margin-top:7px;">
                                  Cypress Test Execution Dashboard
                                </div>
                              </td>
                              <td align="right" valign="top">
                                <span style="display:inline-block;background:#7c5cfc;color:#ffffff;padding:8px 12px;border-radius:7px;font-size:11px;font-weight:bold;">
                                  CYPRESS
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- Status banner -->
                      <tr>
                        <td style="padding:24px 30px 10px;">
                          <div style="font-size:11px;color:#64748b;font-weight:bold;letter-spacing:1px;">
                            EXECUTION STATUS
                          </div>
                          <div style="margin-top:10px;padding:17px;background:#f8fafc;border:1px solid #e2e8f0;border-left:5px solid #7c5cfc;border-radius:8px;">
                            <div style="font-size:22px;font-weight:bold;color:#0f172a;">
                              ${{ job.status == 'success' && '✅ SUCCESS' || job.status == 'failure' && '❌ FAILURE' || job.status == 'cancelled' && '⚠️ CANCELLED' || 'ℹ️ COMPLETED WITH WARNINGS' }}
                            </div>
                            <div style="font-size:13px;color:#64748b;margin-top:7px;">
                              Run #${{ github.run_number }} · ${{ github.event_name }}
                            </div>
                          </div>
                        </td>
                      </tr>

                      <!-- Test metrics -->
                      <tr>
                        <td style="padding:20px 30px 8px;">
                          <div style="font-size:17px;font-weight:bold;color:#0f172a;margin-bottom:15px;">
                            Test Execution Overview
                          </div>
                          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                              <td width="50%" style="padding:0 6px 12px 0;">
                                <div style="padding:16px;background:#f1f5f9;border-radius:9px;">
                                  <div style="font-size:12px;color:#64748b;">TOTAL TESTS</div>
                                  <div style="font-size:30px;font-weight:bold;color:#0f172a;margin-top:6px;">
                                    ${{ steps.summary.outputs.total }}
                                  </div>
                                </div>
                              </td>
                              <td width="50%" style="padding:0 0 12px 6px;">
                                <div style="padding:16px;background:#ecfdf5;border-radius:9px;">
                                  <div style="font-size:12px;color:#047857;">PASSED</div>
                                  <div style="font-size:30px;font-weight:bold;color:#059669;margin-top:6px;">
                                    ${{ steps.summary.outputs.passed }}
                                  </div>
                                </div>
                              </td>
                            </tr>
                            <tr>
                              <td width="50%" style="padding:0 6px 0 0;">
                                <div style="padding:16px;background:#fef2f2;border-radius:9px;">
                                  <div style="font-size:12px;color:#b91c1c;">FAILED</div>
                                  <div style="font-size:30px;font-weight:bold;color:#dc2626;margin-top:6px;">
                                    ${{ steps.summary.outputs.failed }}
                                  </div>
                                </div>
                              </td>
                              <td width="50%" style="padding:0 0 0 6px;">
                                <div style="padding:16px;background:#fff7ed;border-radius:9px;">
                                  <div style="font-size:12px;color:#c2410c;">BROKEN / SKIPPED</div>
                                  <div style="font-size:30px;font-weight:bold;color:#ea580c;margin-top:6px;">
                                    ${{ steps.summary.outputs.broken }} / ${{ steps.summary.outputs.skipped }}
                                  </div>
                                </div>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- Run details -->
                      <tr>
                        <td style="padding:25px 30px;">
                          <div style="font-size:17px;font-weight:bold;color:#0f172a;margin-bottom:12px;">
                            Execution Details
                          </div>
                          <table role="presentation" width="100%" cellpadding="10" cellspacing="0" border="0" style="font-size:13px;border:1px solid #e2e8f0;border-collapse:collapse;">
                            <tr style="background:#f8fafc;">
                              <td style="color:#64748b;border-bottom:1px solid #e2e8f0;">Application</td>
                              <td style="font-weight:bold;border-bottom:1px solid #e2e8f0;">Underwriter Fleet</td>
                            </tr>
                            <tr>
                              <td style="color:#64748b;border-bottom:1px solid #e2e8f0;">Trigger</td>
                              <td style="border-bottom:1px solid #e2e8f0;">${{ github.event_name }}</td>
                            </tr>
                            <tr style="background:#f8fafc;">
                              <td style="color:#64748b;border-bottom:1px solid #e2e8f0;">Branch / Ref</td>
                              <td style="border-bottom:1px solid #e2e8f0;">${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="color:#64748b;border-bottom:1px solid #e2e8f0;">Test filter</td>
                              <td style="border-bottom:1px solid #e2e8f0;">${{ github.event.inputs.grepTags || 'All tests' }}</td>
                            </tr>
                            <tr style="background:#f8fafc;">
                              <td style="color:#64748b;">Workflow run</td>
                              <td>#${{ github.run_number }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- Report links -->
                      <tr>
                        <td style="padding:0 30px 30px;">
                          <div style="font-size:17px;font-weight:bold;color:#0f172a;margin-bottom:14px;">
                            Explore Your Results
                          </div>
                          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                              <td style="background:#6d4aff;border-radius:7px;">
                                <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" style="display:inline-block;padding:13px 19px;color:#ffffff;text-decoration:none;font-size:13px;font-weight:bold;">
                                  📊 Open Allure Report
                                </a>
                              </td>
                              <td width="10"></td>
                              <td style="background:#14213d;border-radius:7px;">
                                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="display:inline-block;padding:13px 19px;color:#ffffff;text-decoration:none;font-size:13px;font-weight:bold;">
                                  🔗 View Workflow
                                </a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- Footer -->
                      <tr>
                        <td style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:20px 30px;text-align:center;">
                          <div style="font-size:12px;font-weight:bold;color:#475569;">
                            NIRVANA QA AUTOMATION
                          </div>
                          <div style="font-size:11px;color:#94a3b8;margin-top:6px;">
                            Automated report generated by GitHub Actions
                          </div>
                          <div style="font-size:11px;color:#94a3b8;margin-top:5px;">
                            Please do not reply to this automated email.
                          </div>
                        </td>
                      </tr>

                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>