name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"        # existing weekly Monday run
    - cron: "30 12 24 9 *"     # one-off: Sept 24, 12:30 UTC = 6:00 PM IST today
  workflow_dispatch:
    inputs:
      grepTags:
        description: "Tag to filter tests (e.g. @NonFleet). Leave blank to run all."
        required: false
        default: ""

permissions:
  contents: write   # needed to push the report to gh-pages

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
        env:
          CYPRESS_agentEmail: ${{ secrets.AGENT_EMAIL }}
          CYPRESS_agentPassword: ${{ secrets.AGENT_PASSWORD }}
          CYPRESS_agentName: ${{ secrets.AGENT_NAME }}
          CYPRESS_grepTags: ${{ github.event.inputs.grepTags }}
          CYPRESS_grepOmitFiltered: "true"

      # Keep raw results as a downloadable artifact if you still want them (optional)
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: cypress/report/allure-results
          retention-days: 14

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/images-videos/videos
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/images-videos/screenshots
          retention-days: 7

      # --- Publish Allure report to GitHub Pages ---
      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build report with history
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: cypress/report/allure-results
          allure_history: allure-history
          keep_reports: 20
          gh_pages: gh-pages

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: cypress/report/allure-report
          force_orphan: true

      - name: Verify report exists
        if: always()
        run: ls -la cypress/report/allure-report || echo "Report folder missing!"

      - name: Add report link to run summary
        if: always()
        run: |
          echo "### 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "[Open report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY